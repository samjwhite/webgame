<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Літо в селі</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Літо в селі">
  <meta name="theme-color" content="#2b1d14">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=dev">
  <link rel="manifest" href="manifest.webmanifest?v=dev">

  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="objective" hidden>
    <button id="objective-toggle" aria-label="Згорнути або розгорнути завдання">
      <span>Завдання</span><span id="objective-arrow">▲</span>
    </button>
    <div id="objective-body">
      <div id="objective-text"></div>
      <div id="money"></div>
      <div id="checklist" hidden>
        <div class="checklist-title">Щоб потрапити на дискотеку:</div>
        <div class="check-item" id="check-beer"><span class="check"></span><img src="art/ui/beer.png?v=dev" alt=""><span class="label"></span></div>
        <div class="check-item" id="check-suit"><span class="check"></span><img src="art/ui/tracksuit.png?v=dev" alt=""><span class="label"></span></div>
        <div class="check-item" id="check-moped"><span class="check"></span><img src="art/ui/moped.png?v=dev" alt=""><span class="label"></span></div>
      </div>
    </div>
  </div>

  <button id="map-button" hidden>Карта</button>

  <div id="map-view" hidden>
    <div id="map-frame">
      <img src="art/world/map.png?v=dev" alt="Карта села">
      <div id="map-marker"></div>
    </div>
    <p>Торкнись, щоб закрити</p>
  </div>

  <div id="dialog" hidden>
    <p id="dialog-text"></p>
    <span id="dialog-next">▼</span>
  </div>

  <div id="menu" hidden>
    <h1>Літо в селі</h1>
    <p>Полтавщина, 2003</p>
    <button id="continue-button">Продовжити</button>
    <button id="new-game-button">Нова гра</button>
  </div>

  <button id="action-button" aria-label="Дія">A</button>

  <script src="js/assets.js?v=dev"></script>
  <script src="js/map.js?v=dev"></script>
  <script src="js/story.js?v=dev"></script>
  <script src="js/save.js?v=dev"></script>
  <script src="js/dialog.js?v=dev"></script>
  <script src="js/input.js?v=dev"></script>
  <script src="js/world.js?v=dev"></script>
  <script src="js/closeup.js?v=dev"></script>
  <script src="js/game.js?v=dev"></script>
</body>
</html>
