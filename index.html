<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Літо в селі</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Літо в селі">
  <meta name="theme-color" content="#2b1d14">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=dev">
  <link rel="manifest" href="manifest.webmanifest?v=dev">

  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="objective" hidden>
    <button id="objective-toggle" data-label="ui.toggleTasks">
      <span data-text="ui.tasks"></span><span id="objective-arrow">▲</span>
    </button>
    <div id="objective-body">
      <div id="day-text"></div>
      <div id="objective-text"></div>
      <div id="money"></div>
      <div id="bag-text"></div>
      <div id="checklist" hidden>
        <div class="checklist-title" data-text="ui.checklistTitle"></div>
        <div class="check-item" id="check-beer"><span class="check"></span><img src="art/ui/beer.png?v=dev" alt=""><span class="label"></span></div>
        <div class="check-item" id="check-suit"><span class="check"></span><img src="art/ui/tracksuit.png?v=dev" alt=""><span class="label"></span></div>
        <div class="check-item" id="check-moped"><span class="check"></span><img src="art/ui/moped.png?v=dev" alt=""><span class="label"></span></div>
      </div>
    </div>
  </div>

  <div id="location-name" hidden></div>

  <div id="shop-menu" hidden>
    <div id="shop-head"><span data-text="shop.title"></span><span id="shop-money"></span></div>
    <div id="shop-list"></div>
  </div>

  <button id="map-button" data-text="ui.map" hidden></button>

  <div id="map-view" hidden>
    <div id="map-frame">
      <img src="art/ui/village_map.png?v=dev" id="map-image" alt="">
      <div id="map-labels"></div>
      <div id="map-marker"></div>
    </div>
    <p data-text="ui.mapClose"></p>
  </div>

  <div id="choice-menu" hidden>
    <div id="choice-title"></div>
    <div id="choice-list"></div>
  </div>

  <div id="dialog" hidden>
    <img id="dialog-portrait" alt="" hidden>
    <div id="dialog-name" hidden></div>
    <p id="dialog-text"></p>
    <span id="dialog-next">▼</span>
  </div>

  <div id="menu" hidden>
    <h1 data-text="ui.title"></h1>
    <p data-text="ui.subtitle"></p>
    <div id="language-picker" role="group" data-label="ui.language">
      <button class="flag" data-language="uk" aria-label="Українська">
        <svg viewBox="0 0 3 2"><rect width="3" height="1" fill="#0057b7"/><rect y="1" width="3" height="1" fill="#ffd700"/></svg>
      </button>
      <button class="flag" data-language="en" aria-label="English">
        <svg viewBox="0 0 60 30"><clipPath id="uk-flag-clip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-flag-clip)" stroke="#c8102e" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/></svg>
      </button>
      <button class="flag" data-language="it" aria-label="Italiano">
        <svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>
      </button>
    </div>
    <button id="continue-button" data-text="ui.continue"></button>
    <button id="new-game-button" data-text="ui.newGame"></button>
  </div>

  <button id="action-button" data-label="ui.action">A</button>

  <script src="js/i18n.js?v=dev"></script>
  <script src="js/text/uk.js?v=dev"></script>
  <script src="js/text/en.js?v=dev"></script>
  <script src="js/text/it.js?v=dev"></script>
  <script src="js/assets.js?v=dev"></script>
  <script src="js/map.js?v=dev"></script>
  <script src="js/story.js?v=dev"></script>
  <script src="js/save.js?v=dev"></script>
  <script src="js/dialog.js?v=dev"></script>
  <script src="js/input.js?v=dev"></script>
  <script src="js/world.js?v=dev"></script>
  <script src="js/closeup.js?v=dev"></script>
  <script src="js/game.js?v=dev"></script>
  <script src="js/dev.js?v=dev"></script>
</body>
</html>
