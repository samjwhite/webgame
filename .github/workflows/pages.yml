name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version so phones skip old cached files
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=$VERSION/g" index.html
          sed -i "s/ART_VERSION = \"dev\"/ART_VERSION = \"$VERSION\"/" js/assets.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
